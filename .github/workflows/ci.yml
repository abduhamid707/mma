name: CI
on:
  push:
    branches: [main, feat/ustoz-mma-crm-mvp]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check syntax
        run: npm run check
      - name: Validation tests
        run: npm test
